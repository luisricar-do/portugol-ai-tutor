<header class="dialog-header">
  <h2 id="dialogo-limpar-tutor-titulo">Limpar conversa</h2>
</header>

<div class="dialog-body">
  <p>Apagar todas as mensagens desta conversa com a ADA?</p>
  <p>Os destaques no código também serão removidos.</p>
</div>

<footer class="dialog-footer">
  <button type="button" class="btn" cdkFocusInitial (click)="dialogRef.close(false)">Cancelar</button>
  <button type="button" class="btn btn-ghost warn" (click)="dialogRef.close(true)">Apagar</button>
</footer>
