<ng-keyboard-shortcuts [shortcuts]="shortcuts" />

<div class="sidebar">
  <button mat-ripple type="button" class="sidebar-button" matTooltip="Iniciar execução"
    [disabled]="executor.running || transpiling" (click)="runCode()">
    <svg-icon src="assets/icon-start.svg" svgClass="text-secondary" aria-hidden="true" focusable="false" />
  </button>

  <button mat-ripple type="button" class="sidebar-button" matTooltip="Parar execução"
    [disabled]="!executor.running && !transpiling" (click)="stopCode()">
    <svg-icon src="assets/mdi/square-rounded-outline.svg" svgClass="text-red" aria-hidden="true" focusable="false" />
  </button>

  <div class="sidebar-divider"></div>

  <button mat-ripple type="button" class="sidebar-button" matTooltip="Salvar arquivo" gaEvent="editor_save_file"
    gaCategory="editor" gaLabel="Botão de Salvar arquivo" (click)="saveFile()">
    <svg-icon src="assets/mdi/content-save-outline.svg" svgClass="text-blue" aria-hidden="true" focusable="false" />
  </button>

  <button mat-ripple type="button" class="sidebar-button" matTooltip="Salvar como…" gaEvent="editor_save_as"
    gaCategory="Editor" gaLabel="Botão de Salvar como" [matMenuTriggerFor]="saveMenu">
    <svg-icon src="assets/mdi/content-save-settings-outline.svg" svgClass="text-blue" aria-hidden="true"
      focusable="false" />
  </button>

  <mat-menu #saveMenu="matMenu">
    <button mat-menu-item disabled type="button">Salvar como</button>

    @if (hasSaveFilePickerSupport) {
    <button mat-menu-item type="button" aria-label="Escolher um arquivo" gaEvent="editor_save_as_file_picker"
      gaCategory="Editor" gaLabel="Botão de Salvar como - Ação Escolher um arquivo" (click)="saveFileWithPicker()">
      <mat-icon>
        <svg-icon src="assets/mdi/content-save-move.svg" aria-hidden="true" focusable="false" />
      </mat-icon>

      Escolher um arquivo
    </button>
    }

    <button mat-menu-item type="button" aria-label="Download" gaEvent="editor_save_as_download" gaCategory="Editor"
      gaLabel="Botão de Salvar como - Ação Download" (click)="saveFile()">
      <mat-icon>
        <svg-icon src="assets/mdi/download.svg" aria-hidden="true" focusable="false" />
      </mat-icon>

      Download
    </button>

    <button mat-menu-item type="button" aria-label="Download para Portugol Studio"
      gaEvent="editor_save_as_download_portugol_studio" gaCategory="Editor"
      gaLabel="Botão de Salvar como - Ação Download para Portugol Studio" (click)="saveFile(true)">
      <mat-icon>
        <svg-icon src="assets/lightbulb-sq.svg" aria-hidden="true" focusable="false" />
      </mat-icon>

      Download para abrir no Portugol Studio
    </button>

    <button mat-menu-item type="button" aria-label="Abrir nova aba como texto" gaEvent="editor_save_as_text"
      gaCategory="Editor" gaLabel="Botão de Salvar como - Ação Nova aba como texto" (click)="saveFileManual('text')">
      <mat-icon>
        <svg-icon src="assets/mdi/file-document-outline.svg" aria-hidden="true" focusable="false" />
      </mat-icon>

      Abrir nova aba como texto
    </button>

    <button mat-menu-item type="button" aria-label="Abrir nova aba como binário" gaEvent="editor_save_as_binary"
      gaCategory="Editor" gaLabel="Botão de Salvar como - Ação Nova aba como binário"
      (click)="saveFileManual('binary')">
      <mat-icon>
        <svg-icon src="assets/mdi/file-download-outline.svg" aria-hidden="true" focusable="false" />
      </mat-icon>

      Abrir nova aba como binário
    </button>
  </mat-menu>

  <button mat-ripple type="button" class="sidebar-button" matTooltip="Abrir arquivo" (click)="fileInput.click()">
    <svg-icon src="assets/mdi/folder-open-outline.svg" svgClass="text-primary" aria-hidden="true" focusable="false" />
    <input #fileInput type="file" hidden accept=".por,text/plain" (change)="openFile($event)" />
  </button>

  <button mat-ripple type="button" class="sidebar-button" matTooltip="Compartilhar código" [disabled]="sharing"
    (click)="shareFile()">
    <svg-icon src="assets/mdi/share-variant-outline.svg" svgClass="text-secondary" aria-hidden="true"
      focusable="false" />
  </button>

  <div class="sidebar-divider"></div>

  <button mat-ripple type="button" class="sidebar-button" [class.sidebar-button--tutor-open]="tutorOverlay.isOpen()"
    matTooltip="Abrir tutora ARIA (⌘⇧A ou Ctrl+Shift+A; Esc fecha)" aria-label="Abrir o painel da tutora ARIA"
    gaEvent="editor_open_tutor_hud" gaCategory="Editor" gaLabel="Botão tutora ARIA" (click)="openTutorHud($event)">
    <svg-icon src="assets/mdi/brain.svg" svgClass="text-primary" aria-hidden="true" focusable="false" />
  </button>

  <button mat-ripple type="button" class="sidebar-button" matTooltip="Abrir seção de Ajuda" (click)="openHelp()">
    <svg-icon src="assets/mdi/help-circle-outline.svg" svgClass="text-blue" aria-hidden="true" focusable="false" />
  </button>

  <button mat-ripple type="button" class="sidebar-button" matTooltip="Remover destaques do tutor no código"
    (click)="clearTutorEditorDecorations()">
    <svg-icon src="assets/mdi/eraser.svg" svgClass="text-secondary" aria-hidden="true" focusable="false" />
  </button>

  <button mat-ripple type="button" class="sidebar-button" matTooltip="Configurações" gaEvent="editor_open_settings"
    gaCategory="Editor" gaLabel="Botão de Configurações" (click)="openSettings()">
    <svg-icon src="assets/mdi/cog-outline.svg" svgClass="text-primary" aria-hidden="true" focusable="false" />
  </button>
</div>

<div #editorStage class="editor-stage" [class.tutor-focus-mode]="immersion.focusMode()"
  [class.tutor-ghost-soft]="immersion.ghostLinesMuted()"
  [class.tutor-observer-mode]="tutorOverlay.isOpen() && tutorOverlay.isDimmed()">
  <div class="editor-inner">
    <as-split direction="vertical">
      <as-split-area [size]="80">
        <as-split direction="horizontal">
          <as-split-area [size]="100">
            <ngx-monaco-editor [options]="codeEditorOptions" [(ngModel)]="code" (init)="onEditorInit($event)" />
          </as-split-area>

          <as-split-area [size]="0">
            <ngx-monaco-editor [options]="generatedCodeEditorOptions" [(ngModel)]="executor.byteCode" />
          </as-split-area>
        </as-split>
      </as-split-area>

      <as-split-area [size]="20">
        <ngx-monaco-editor id="output" [options]="stdOutEditorOptions" [(ngModel)]="executor.stdOut"
          (init)="onStdOutEditorInit($event)" />
      </as-split-area>
    </as-split>
  </div>

  @if (immersion.dataFlowConnections().length > 0 || immersion.hudLinkLine() !== null) {
  <svg #flowSvg class="data-flow-layer" [class.data-flow-layer--muted]="immersion.ghostLinesMuted()"
    aria-hidden="true"></svg>
  }
</div>

<ng-template #shareSnackTemplate let-data>
  <div class="share-snack">
    <span class="share-snack-text">
      <span class="share-snack-link">
        <strong>Link gerado:</strong>
        <a target="_blank" [href]="data.url">
          {{ data.url | slice: 0 : 10 }}…{{ data.url | slice: data.url.length - 14 }}
        </a>
      </span>

      <small>
        <svg-icon src="assets/mdi/clock-alert.svg" svgClass="text-red" aria-hidden="true" focusable="false" />
        Este link expira em 15 dias.
      </small>
    </span>

    <button mat-raised-button color="primary" type="button" (click)="copyStringAndCloseSnack(data.url)">COPIAR</button>
  </div>
</ng-template>
