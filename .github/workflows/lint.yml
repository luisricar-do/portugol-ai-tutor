name: Build and Lint
permissions:
  contents: read
on:
  push:
    branches:
      - develop

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v5

      - name: Setup Node.js 📦
        uses: actions/setup-node@v6
        with:
          node-version: lts/*

      - name: Install dependencies 🔧
        run: npm ci --include=dev

      - name: Build code 🚚
        run: |
          npm run build
          npm run release

      - name: Lint 🚨
        run: npm run lint
