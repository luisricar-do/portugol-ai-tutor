name: Build and Deploy (Production)

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

on:
  push:
    branches:
      - develop

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v5

      - name: Setup Node.js 📦
        uses: actions/setup-node@v6
        with:
          node-version: lts/*

      - name: Install dependencies 🔧
        run: npm ci --include=dev

      - name: Inject build version 🏷️
        run: node packages/ide/scripts/inject-version.mjs

      - name: Build code 🚚
        run: npm run build

      - name: Release front-end 🎢
        run: |
          ./packages/ide/cleanup-icons.sh
          npm run release

      - name: Upload Pages artifact 📤
        uses: actions/upload-pages-artifact@v4
        with:
          path: packages/ide/dist/browser

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages 🚀
        id: deployment
        uses: actions/deploy-pages@v5
