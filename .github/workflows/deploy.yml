name: Build and Deploy (Production)

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

on:
  push:
    branches:
      - develop

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Serviço do tutor (maieutica), com `/api`. Lido por packages/ide/scripts/inject-version.mjs.
      AGENT_API_BASE_URL: ${{ vars.AGENT_API_BASE_URL }}
    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v7

      - name: Setup Node.js 📦
        uses: actions/setup-node@v7
        with:
          node-version: lts/*

      - name: Install dependencies 🔧
        run: npm ci --include=dev

      - name: Inject build version 🏷️
        run: node packages/ide/scripts/inject-version.mjs

      - name: Build code 🚚
        run: npm run build

      - name: Release front-end 🎢
        run: |
          sed -i -e 's/%COMMIT_SHA%/'"${GITHUB_SHA}"'/g' -e 's/%BUILD_DATE%/'"$(date -u +%Y-%m-%dT%H:%M:%SZ)"'/g' packages/ide/src/app/version.ts
          ./packages/ide/cleanup-icons.sh
          npm run release

      - name: Upload Pages artifact 📤
        uses: actions/upload-pages-artifact@v4
        with:
          path: packages/ide/dist/browser

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages 🚀
        id: deployment
        uses: actions/deploy-pages@v5
